<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MVST Social Media Strategie</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#1D2BEE;--bg:#F5F3EE;--ink:#141414;--quiet:#6B6862;--line:#E2DED5;--card:#FFFFFF;--tint:#EEF0FE}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3,h4{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.01em;margin:0}
p{margin:0 0 12px}
#app{max-width:1040px;margin:0 auto;padding:0 16px 64px}
.hero{padding:80px 0 36px}
.eyebrow,.kicker{margin:0 0 10px;color:var(--blue);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.hero h1{font-size:clamp(44px,9vw,92px);line-height:.95;font-weight:700}
.meta{color:var(--quiet);margin:18px 0 0}
.claim{margin-top:40px;display:flex;flex-wrap:wrap;align-items:baseline;gap:18px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(28px,5vw,48px)}
.claim em{font-style:normal;color:var(--blue)}
.claimsub{color:var(--quiet);max-width:60ch;margin-top:8px}
.toc{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:12px 0;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.toc a{flex:none;color:var(--ink);text-decoration:none;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.toc a:hover{border-color:var(--blue);color:var(--blue)}
section{padding:64px 0 8px;scroll-margin-top:60px}
h2{font-size:clamp(30px,5vw,44px);font-weight:700;margin-bottom:22px;display:flex;align-items:baseline;gap:14px;line-height:1.1}
h2 span{color:var(--blue);font-size:.45em;font-weight:500}
h3{font-size:22px;margin:36px 0 14px}
h4{font-size:18px}
.lead{font-size:19px;max-width:70ch}
.muted,.note{color:var(--quiet);font-size:14px}
.note{font-style:italic}
.callout{background:var(--blue);color:#fff;border-radius:12px;padding:14px 18px;font-weight:500;margin:18px 0}
.callout.soft{background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--blue);font-weight:400}
.aud{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.audc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.audc.focus{border:2px solid var(--blue);background:var(--tint)}
.tagline{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);font-weight:600;margin-bottom:6px}
.audc h4{font-size:22px;margin-bottom:8px}
.ask{font-style:italic;color:var(--quiet);font-size:15px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px}
.tiles b{display:block;font-family:"Bricolage Grotesque",sans-serif;color:var(--blue);margin-bottom:2px}
.funnel{display:flex;align-items:stretch;gap:8px;margin:22px 0 10px}
.fs{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;position:relative}
.fs.key{border:2px solid var(--blue);background:var(--tint)}
.fs.side{margin-bottom:20px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.fs.side p{margin:0}
.fs .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:14px;margin-bottom:8px}
.fs.side .n{margin:0}
.fs .think{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;margin:6px 0 8px}
.fs .m{font-size:13px;color:var(--quiet);border-top:1px solid var(--line);padding-top:8px;margin:0}
.arrow{align-self:center;color:var(--blue);font-size:24px;font-weight:700}
.check{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:14px 18px;margin-top:8px}
.check b{font-family:"Bricolage Grotesque",sans-serif;margin-right:6px}
.check span{background:var(--blue);border-radius:999px;padding:4px 12px;font-size:14px}
.check em{font-style:normal;opacity:.75;font-size:14px;flex-basis:100%}
.profiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.pc.pfocus{border-top:4px solid var(--blue)}
.pc .freq{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:700;color:var(--blue);margin:0}
.pc h4{font-size:20px;margin:2px 0 8px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--quiet);margin-bottom:10px}
.badge.on{background:var(--blue);color:#fff}
.pc p:last-child{font-size:14px;margin:0}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;margin-top:8px}
.wk{background:var(--card);border:1px solid var(--line);padding:18px;margin-right:-1px}
.wk:first-child{border-radius:16px 0 0 16px}.wk:last-child{border-radius:0 16px 16px 0}
.wk.key{background:var(--tint);border-color:var(--blue);position:relative;z-index:1}
.wn{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);font-weight:600;margin:0 0 6px}
.wk h4{margin-bottom:6px}
.wk p{font-size:14px}
.who{font-size:12px;font-weight:600;background:var(--bg);border-radius:999px;padding:3px 10px}
.months{display:flex;gap:10px;flex-wrap:wrap}
.months div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:180px}
.months span{display:block;font-size:12px;color:var(--quiet);text-transform:uppercase;letter-spacing:.06em}
.months b{font-family:"Bricolage Grotesque",sans-serif;font-size:20px}
.months .q{border-style:dashed}.months .q b{font-size:16px}
.ind{border-top:2px solid var(--ink);margin-top:56px}
.ind h2{font-size:clamp(32px,6vw,54px)}
.personas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.persona{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.ph{background:var(--blue);color:#fff;padding:18px}
.pnum{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;opacity:.6;margin-right:8px}
.seg{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:999px}
.ph h4{font-size:21px;margin-top:10px;line-height:1.2}
dl{margin:0;padding:6px 18px;flex:1}
.attr{padding:9px 0;border-bottom:1px solid var(--line)}
.attr:last-child{border:0}
dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--quiet);font-weight:600}
dd{margin:2px 0 0;font-size:14.5px;line-height:1.45}
.win{background:var(--tint);padding:14px 18px;font-size:14.5px;font-weight:500}
.win span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);font-weight:700;margin-bottom:2px}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.qn{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:var(--blue);font-size:20px;line-height:1.2}
.qq{font-weight:600;margin-bottom:8px;line-height:1.4}
.hook{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;border-left:3px solid var(--blue);padding-left:10px;color:#2a2a2a}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;background:var(--bg);border-radius:999px;padding:3px 10px;color:var(--quiet)}
.tag.niklas{background:var(--ink);color:#fff}.tag.joshua{background:#fff;color:var(--blue);border:1px solid var(--blue)}.tag.page{background:var(--blue);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.themes{display:grid;gap:8px}
.theme{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.theme b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
.chip.strong{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.partner{background:var(--tint);border-color:var(--blue);color:var(--blue)}
.mix{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mix div{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);font-size:15px}
.mix div:last-child{border:0}
.mix b{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;color:var(--blue)}
.mix .plus{background:var(--bg)}
.sol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sol div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px}
.sol b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:16px;margin-bottom:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.todo{list-style:none;padding:0;margin:12px 0 0}
.todo li{padding:9px 0 9px 30px;border-bottom:1px solid var(--line);position:relative;font-size:15px}
.todo li:last-child{border:0}
.todo li::before{content:"";position:absolute;left:0;top:12px;width:16px;height:16px;border:1.5px solid var(--blue);border-radius:4px}
footer{margin-top:64px;color:var(--quiet);font-size:12.5px;border-top:1px solid var(--line);padding-top:16px}
#gate{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 32px;width:100%;max-width:380px;text-align:center}
.box .logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:30px;color:var(--blue)}
.box p{color:var(--quiet);margin:6px 0 22px}
.box input{width:100%;font:inherit;padding:12px 14px;border:1px solid #CFCBC1;border-radius:10px;background:var(--bg)}
.box input:focus{outline:2px solid var(--blue);border-color:transparent}
.box button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer}
.err{color:#C0362C;font-size:14px;min-height:20px;margin-top:10px}
@media (max-width:860px){.aud,.tiles,.personas,.profiles,.qs,.two,.sol{grid-template-columns:1fr}.funnel{flex-direction:column}.arrow{transform:rotate(90deg);align-self:center}.weeks{grid-template-columns:1fr 1fr;gap:8px}.wk,.wk:first-child,.wk:last-child{border-radius:14px;margin:0}}
@media (max-width:480px){.weeks{grid-template-columns:1fr}.hero{padding-top:52px}}
</style></head>
<body>
<div id="gate"><form class="box" id="f">
  <div class="logo">MVST</div>
  <p>Social Media Strategie</p>
  <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" autofocus>
  <button type="submit">Öffnen</button>
  <div class="err" id="err"></div>
</form></div>
<main id="app" hidden></main>

  try{
